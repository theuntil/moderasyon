# Panel: statik React uygulaması + /api isteklerini iç ağdaki admin-api servisine yönlendirme.
# admin-api dışarıya hiç açılmaz; sadece bu nginx üzerinden erişilir.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Güvenlik başlıkları
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Docker'ın dahili DNS'i: admin-api adresi her 10 saniyede yeniden çözülür. Deploy'da admin-api
    # yeniden oluşturulup yeni IP aldığında panel eski IP'ye istek atıp 502 vermez.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location /api/ {
        set $admin_api http://admin-api:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $admin_api;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Traefik'in eklediği gerçek istemci IP'si korunur (audit log ve giriş sınırı için)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Hash'li dosya adları değişmediği için uzun süre önbelleklenebilir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Tek sayfa uygulama: bilinmeyen yollar index.html'e düşer
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
